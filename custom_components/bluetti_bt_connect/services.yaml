read_registers:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: bluetti_bt_connect
    address:
      required: true
      example: 1700
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    slave:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

set_schedule:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: bluetti_bt_connect
    periods:
      required: true
      example: >-
        [{"action": "charge", "start": "11:01", "end": "13:59"},
        {"action": "discharge", "start": "18:00", "end": "21:00"}]
      selector:
        object:
